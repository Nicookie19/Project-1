# Install as /etc/nginx/sites-available/forma
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/forma;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
